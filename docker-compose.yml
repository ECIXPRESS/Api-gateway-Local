version: '3.8'

services:
  # Redis Service (Kept for shared infrastructure/caching if needed by Gateway)
  redis:
    image: redis:7-alpine
    container_name: eci-express-redis
    ports:
      - "6379:6379"
    networks:
      - microservices-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Gateway (Now points to external Azure Web Apps)
  gateway:
    build:
      context: .
      dockerfile: gateway.Dockerfile
    container_name: eci-express-gateway
    ports:
      - "8081:8081"
    environment:
      - NODE_ENV=production
      - STOCK_SERVICE_URL=https://kappa-stock-dev-gdgqbqegdqfce8ad.mexicocentral-01.azurewebsites.net/
      - ORDERS_SERVICE_URL=https://kappa-orders-dev-fbeea3c4gbfrhyhf.mexicocentral-01.azurewebsites.net/
      - STATS_SERVICE_URL=https://kappa-stats-dev-bqbahbc6e2araxa2.mexicocentral-01.azurewebsites.net/
      - SCHEDULE_SERVICE_URL=https://kappa-schedule-dev-ffgaeaa7cva3baa7.mexicocentral-01.azurewebsites.net/

      - JWT_SECRET=ecixpress-secret-key
      - GATEWAY_TIMEOUT=30000
      - HTTP_CLIENT_TIMEOUT=30000
      - PROXY_READ_TIMEOUT=30000
      - PROXY_CONNECT_TIMEOUT=30000
    networks:
      - microservices-network

    # Only depends on Redis, as other services are external
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    # Use public DNS to ensure external Azure URLs can be resolved
    dns:
      - 8.8.8.8
      - 1.1.1.1

# Removed all other microservice definitions (users-service, authentication-service, etc.)

networks:
  microservices-network:
    driver: bridge